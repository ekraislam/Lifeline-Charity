version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lifeline_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-LifelineSecurePass2026!}
      MYSQL_DATABASE: lifeline_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initialization scripts mapped to initdb directory
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/init-admin.sql:/docker-entrypoint-initdb.d/02-init-admin.sql
    networks:
      - lifeline-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeline_backend
    restart: always
    env_file:
      - ./backend/.env.example
    environment:
      - DB_HOST=db
      # Override DB variables to match the container setup
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-LifelineSecurePass2026!}
      - DB_NAME=lifeline_db
      - API_URL=${API_URL:-https://backend-lifeline.smsakib.shop}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5010:5000"
    networks:
      - lifeline-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://backend-lifeline.smsakib.shop}
    container_name: lifeline_frontend
    restart: always
    ports:
      - "8040:80"
    networks:
      - lifeline-network
    depends_on:
      - backend

networks:
  lifeline-network:
    driver: bridge

volumes:
  db_data:
  backend_uploads:
